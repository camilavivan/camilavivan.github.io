########################################
# 基础配置
########################################

# 主导航菜单
# 图标说明：https://github.com/D-Sketon/hexo-theme-reimu/issues/30
menu:
  - name: home
    url: ""
    icon: # default use taichi icon, you can use a hexadecimal representation of fontawesome or icon_font, like 'f0c1'
  - name: archives
    url: "archives"
    icon:
  - name: about
    url: "about"
    icon:
  - name: friend
    url: "friend"
    icon:

# 友链
friends:
  shuffle: false                  # 是否随机打乱友链顺序

mainSections: ["post"]

# 日期时间格式（保持 Hugo 标准，方便中文显示）
yearFormat: "2006"
monthFormat: "2006-01"
dateFormat: "2006-01-02"
timeFormat: "2006-01-02 15:04:05"

author: 流水易寒                   # 请改成你的名字
email: 18816230062qk@gmail.com             # 请改成你的邮箱
description: "不想做开发的运维不是好运维"   # 优化为更自然的中文描述
# subtitle: "少女祈祷中..."
subtitle:
  typing:
    enable: false                 # 如需打字机效果可改为 true
    strings:
      # - 欢迎来到我的博客
      # - 记录生活，分享技术
      # - 少女祈祷中...
    typeSpeed: 100
    backSpeed: 50
    backDelay: 2000
    startDelay: 300
    loop: true
    shuffle: true
    showCursor: true
    cursorChar: "|"
    smartBackspace: false
  text: "少女祈祷中..."             # 关闭打字机效果时显示的文字

banner: "images/banner.webp"
# 也可以使用在线图片
# banner: "https://example.com/banner.webp"

banner_srcset:
  enable: false
  srcset:
    - src: "images/banner-600w.webp"
      media: "(max-width: 479px)"
    - src: "images/banner-800w.webp"
      media: "(max-width: 799px)"
    - src: "images/banner.webp"
      media: "(min-width: 800px)"

avatar: "avatar.webp"             # 头像请放到 static/avatar/avatar.webp

# 文章封面控制（未设置时默认使用 banner）
cover:


# 文章目录（优先级低于 Front-matter 中的 toc）
toc: true

# Open Graph
open_graph:
  enable: true
  options:

# 文章摘要链接文字
excerpt_link: 阅读全文             # 原 Read More → 改为中文

# 页脚版权
copyright:

footer:
  since: 2024                     # 建站年份（请改成你的）
  powered: true
  count: true
  busuanzi: true                  # 开启不蒜子统计（中文博客常用）
  icon:
    url: "../images/taichi.png"
    rotate: true
    mask: true

# 侧边栏
sidebar:
  position: left                 # left | right | false
  menu: true
  article:
    show_common: true

# 社交链接（推荐保留常用国内平台）
social:
  # email: mailto:your@email.com
  # github: https://github.com/你的用户名
  # bilibili: https://space.bilibili.com/你的UID
  # weibo: https://weibo.com/你的用户名
  # zhihu: https://www.zhihu.com/people/你的用户名
  # twitter: https://twitter.com/你的用户名
  # telegram: https://t.me/你的用户名

widgets:
  - category
  - tag
  - tagcloud
  - recent_posts

# 侧边栏组件数量限制
category_limits: 10
tag_limits: 10
recent_posts_limits: 5
tagcloud_limits: 20

# 归档行为
only_show_capsule_in_index: false
uppercase_capsule: true

show_update_time: true           # 是否显示文章更新时间

# 摘要
summary:
  enable: false
  style: 'subtitle'               # 'subtitle' 或 'blockquote'

# RSS
rss:
  limit: 10
  showFullContent: false
  showCopyright: false

# 排序
sort_order:
  taxonomy:
    category: date-reverse
    tag: date-reverse
  archive: date-reverse
  home: default

# 分页
paginate:
  archive:
  post:

########################################
# 样式相关
########################################

layout:
  max_width: 1350px

triangle_badge:
  enable: false
  icon: github
  link: https://github.com/Ghostpanter

anchor_icon:

reimu_cursor:
  enable: true                    # 灵梦鼠标指针（主题特色）
  cursor:
    default: ../images/cursor/reimu-cursor-default.png
    pointer: ../images/cursor/reimu-cursor-pointer.png
    text: ../images/cursor/reimu-cursor-text.png

icon_font: 4552607_ex15nbittbh

# 字体策略：自定义字体 → Google Fonts → 本地回退
custom_font:
  enable: false
  article:
  code:

# Google Fonts（优先级高于本地字体）
font:
  enable: true
  article:
    - Mulish
    - Noto Serif SC               # 适合中文显示
  code:

# 本地回退字体
local_font:
  article:
    - "-apple-system"
    - PingFang SC
    - Microsoft YaHei
    - sans-serif
  code:
    - Menlo
    - Monaco
    - Consolas
    - monospace

dark_mode:
  button: true
  type: auto                      # auto | true | false

########################################
# 统计
########################################

baidu_analytics: false
google_analytics: false
clarity: false

########################################
# Markdown 显示
########################################

mermaid:
  zoom: true

code_block:
  expand: true                    # 代码块默认展开

clipboard:
  success:
    en: Copy successfully (*^▽^*)
    zh-CN: 复制成功 (*^▽^*)
    zh-TW: 複製成功 (*^▽^*)
    ja: コピー成功 (*^▽^*)
    pt-BR: Copiado com sucesso (*^▽^*)
  fail:
    en: Copy failed (ﾟ⊿ﾟ)ﾂ
    zh-CN: 复制失败 (ﾟ⊿ﾟ)ﾂ
    zh-TW: 複製失敗 (ﾟ⊿ﾟ)ﾂ
    ja: コピー失敗 (ﾟ⊿ﾟ)ﾂ
    pt-BR: Falha ao copiar (ﾟ⊿ﾟ)ﾂ
  copyright:
    enable: false
    count: 50
    license_type: by-nc-sa

math:
  katex:
    enable: true                  # 推荐使用 KaTeX（速度快）
  mathjax:
    enable: false
    options:
      [
        {
          tex:
            {
              tags: "ams",
              useLabelIds: true,
              inlineMath: [["$", "$"], ['\\(', '\\)']],
              displayMath: [["$$", "$$"], ['\\[', '\\]']],
              processEscapes: true,
              processEnvironments: true,
              autoload: { color: [], colorv2: ["color"] },
              packages: { "[+]": ["noerrors"] },
            },
          options:
            {
              skipHtmlTags:
                ["script", "noscript", "style", "textarea", "pre", "code"],
              ignoreHtmlClass: "tex2jax_ignore",
              processHtmlClass: "tex2jax_process",
            },
          loader: { load: ["input/asciimath", "[tex]/noerrors"] },
        },
      ]

# 段落锚点
anchor:
  explicit:
    enable: false
    marker: "{#anchor-"
    prefix: "anchor-"
  auto:
    enable: false
    length: 60

########################################
