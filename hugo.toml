baseURL = 'https://camilavivan.github.io/'          # 改成你的实际地址，比如 https://username.github.io/
languageCode = 'zh-cn'
title = '我的博客'                      # 改成你的网站标题
theme = 'reimu'

# 启用中文支持
hasCJKLanguage = true

# 更好的代码高亮
[markup.highlight]
  style = 'github'
  lineNos = false
  noClasses = false
  guessSyntax = true

# 数学公式支持（可选）
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]

# 输出格式（如果以后要用 Algolia 搜索可以保留）
[outputs]
home = ["Algolia", "HTML", "RSS"]

[outputFormats.Algolia]
baseName = "algolia"
isPlainText = true
mediaType = "application/json"
notAlternative = true